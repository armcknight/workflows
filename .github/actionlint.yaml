# actionlint config. See https://github.com/rhysd/actionlint

# actionlint ships a fixed list of GitHub-hosted runner labels and rejects any
# label it does not know. Labels newer than the pinned actionlint land here until
# a release learns them. Declaring a label only adds to the known set, so a typo
# in any other label is still caught.
self-hosted-runner:
  labels:
    - macos-26

# GitHub has the job context's workflow_repository and workflow_sha, but the
# pinned actionlint does not know them yet. The reusable workflows check out
# their scripts with them, at the commit of the workflow.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
