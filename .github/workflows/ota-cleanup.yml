name: OTA cleanup (reusable)

# Delete a PR's staging builds from S3 when it closes. Caller triggers on
# pull_request: closed and needs repo vars AWS_ROLE_ARN/AWS_REGION/S3_BUCKET
# and permissions: id-token: write.

on:
  workflow_call: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
    # scripts/ at the commit of this workflow, out of the workspace, in $SCRIPTS.
    - name: Check out the scripts
      uses: armcknight/workflows/.github/actions/scripts@main
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Delete this PR's staging builds from S3
      env:
        S3_BUCKET: ${{ vars.S3_BUCKET }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PROJECT: ${{ github.event.repository.name }}
      run: |
        "$SCRIPTS/staging/cleanup.sh"
