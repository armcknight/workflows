name: OTA cleanup (reusable)

# Delete a PR's staging builds from S3 when it closes. Caller triggers on
# pull_request: closed and needs repo vars AWS_ROLE_ARN/AWS_REGION/S3_BUCKET
# and permissions: id-token: write.

on:
  workflow_call: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write

    steps:
    # The scripts in this repository, at the commit of this workflow. They go
    # out of the workspace, so that they are not in the caller's checkout.
    - name: Check out the scripts
      uses: actions/checkout@v5
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .armcknight-workflows
        sparse-checkout: scripts
    - name: Move the scripts out of the workspace
      run: |
        mv .armcknight-workflows "$RUNNER_TEMP/armcknight-workflows"
        echo "SCRIPTS=$RUNNER_TEMP/armcknight-workflows/scripts" >> "$GITHUB_ENV"

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Delete this PR's staging builds from S3
      env:
        S3_BUCKET: ${{ vars.S3_BUCKET }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PROJECT: ${{ github.event.repository.name }}
      run: |
        "$SCRIPTS/staging/cleanup.sh"
