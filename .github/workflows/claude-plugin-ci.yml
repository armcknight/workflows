name: Claude plugin CI (reusable)

# Reusable validation for Claude Code plugin marketplaces. A plugin repo is
# manifests and markdown, so validation is the whole of CI:
#
#   jobs:
#     ci:
#       uses: armcknight/workflows/.github/workflows/claude-plugin-ci.yml@main
#       with:
#         plugin-path: plugins/my-plugin
#
# Worth having because the failure it catches is silent. A command whose YAML
# frontmatter does not parse — an unquoted value containing `:` or `[` is enough
# — still loads at runtime with empty metadata, so its description and
# argument-hint vanish with no error anywhere.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label."
        required: false
        type: string
        default: "ubuntu-latest"
      plugin-path:
        description: "Directory holding the plugin, i.e. the parent of .claude-plugin/plugin.json."
        required: true
        type: string
      marketplace-path:
        description: "Directory holding the marketplace, i.e. the parent of .claude-plugin/marketplace.json."
        required: false
        type: string
        default: "."

    secrets:
      SITE_DISPATCH_TOKEN:
        description: "Token with Contents: read+write on armcknight/mcknight.io. When set, a push to the default branch asks it to refresh its projects page. Empty (the default) skips that."
        required: false

jobs:
  validate:
    name: Validate manifests
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        env:
          PLUGIN_PATH: ${{ inputs.plugin-path }}
        run: claude plugin validate "$PLUGIN_PATH"

      - name: Validate marketplace manifest
        env:
          MARKETPLACE_PATH: ${{ inputs.marketplace-path }}
        run: claude plugin validate "$MARKETPLACE_PATH"

  # On a push to the default branch, never under pull_request, ask mcknight.io
  # to refresh its projects page. Without the SITE_DISPATCH_TOKEN secret it does
  # nothing.
  notify-site:
    name: Notify mcknight.io
    needs: validate
    if: >
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # scripts/ at the commit of this workflow, out of the workspace, in $SCRIPTS.
      - name: Check out the scripts
        uses: armcknight/workflows/.github/actions/scripts@main
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Notify mcknight.io
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          "$SCRIPTS/site/notify.sh"
