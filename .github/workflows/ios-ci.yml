name: iOS CI (reusable)

# Reusable PR pipeline for armcknight iOS apps. Under `pull_request` it runs the
# tests (and the optional UI screenshots) only. A staging build is on demand: the
# caller runs this workflow again from a `/build-staging` PR comment with
# `pr-number` set, and then, only if the tests pass, it builds an ad-hoc staging
# IPA and publishes a presigned OTA install link (see README).
#
# Caller requirements:
#   - repo variables: AWS_ROLE_ARN, AWS_REGION, S3_BUCKET
#   - secrets (via `secrets: inherit`): MATCH_PASSWORD, MATCH_DEPLOY_KEY
#   - a fastlane `test` lane and a `stage` lane that outputs <ipa-name>.ipa
#   - Brewfile taps armcknight/tools and installs its tools cask
#     (`cask 'armcknight/tools/tools'`, provides ota-publish, inject-git-info)
#   - caller grants permissions: contents: read, checks: write,
#     pull-requests: write, id-token: write
#
# Optional: set `ui-screenshots-scheme` and `ui-screenshots-path` to run the UI
# tests a PR adds or changes on a simulator and comment their screenshots on the
# PR. That job also needs the caller to grant contents: write, because it pushes
# the images to an orphan `ui-screenshots` branch.
#
# Under any event other than `pull_request` (a `/build-staging` comment, or the
# refresh workflow's rebuild of an expired staging build), pass `pr-number`. The
# Authorize job then checks the request, and the jobs check out that PR's head
# instead of the triggering ref.
#
# The command text is checked here, not in the caller: the caller runs this
# workflow on every `issue_comment`, and every job is skipped, with no runner,
# unless the comment is `/build-staging` on a PR (or `/refresh-staging`, when
# the caller sets `rebuild`).

on:
  workflow_call:
    inputs:
      ipa-name:
        description: "Base name of the staging IPA from `fastlane stage` (without .ipa)"
        required: true
        type: string
      arkana-keys:
        description: "Space-separated arkana secret key names to materialize into .env. Values are resolved from the caller's secrets (via `secrets: inherit`); arkana fails the build if a declared key is missing."
        required: true
        type: string
      run-tests:
        description: "Run the fastlane `test` lane before staging. Set false for apps with no unit-test scheme."
        required: false
        type: boolean
        default: true
      pr-number:
        description: "PR to stage when the trigger is not `pull_request` (a `/build-staging` comment, or a rebuild from the refresh workflow). Setting it is what makes a staging build. Leave empty under `pull_request`."
        required: false
        type: string
        default: ""
      rebuild:
        description: "Set true only in the refresh caller's job that runs on ota-refresh's `rebuild` output. A `/refresh-staging` comment then starts a staging build, in place of `/build-staging`."
        required: false
        type: boolean
        default: false
      ui-screenshots-scheme:
        description: "Scheme that runs the UI tests. Setting it turns on the ui-screenshots job, which runs only under `pull_request`."
        required: false
        type: string
        default: ""
      ui-screenshots-path:
        description: "Directory of the UI test sources. A test class in a Swift file the PR adds or changes there is run."
        required: false
        type: string
        default: ""
      ui-screenshots-target:
        description: "UI test target, for `-only-testing`. Defaults to the scheme name."
        required: false
        type: string
        default: ""
      ui-screenshots-destination:
        description: "xcodebuild destination. Defaults to the newest available iPhone simulator."
        required: false
        type: string
        default: ""

env:
  # gym's `xcodebuild -showBuildSettings` can exceed the 3s default on projects
  # with many SPM/submodule dependencies; give it room.
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "10"

jobs:
  # A staging build runs the PR's code with the caller's secrets and mints an
  # install link, so check the request before any job checks the code out.
  #
  # The `if:` skips every other comment before a runner starts. A skipped
  # Authorize skips Test and Stage too.
  authorize:
    name: Authorize
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/build-staging') ||
         (inputs.rebuild && startsWith(github.event.comment.body, '/refresh-staging')))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
    - name: Check the staging request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        ASSOCIATION: ${{ github.event.comment.author_association }}
        COMMENT_ID: ${{ github.event.comment.id }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::Set pr-number to stage a PR outside pull_request." >&2
          exit 1
        fi
        if [ "$EVENT" = "issue_comment" ]; then
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) echo "Commenter is $ASSOCIATION; continuing." ;;
            *) echo "::error::Commenter is $ASSOCIATION, which cannot write to this repo. Refusing to stage." >&2; exit 1 ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes --silent || true
        fi
        # A fork's code must not run with this repo's secrets, and closing a PR
        # deletes its staging builds on purpose.
        PR_STATE=$(gh pr view "$PR_NUMBER" --json state,isCrossRepository \
          --jq 'if .isCrossRepository then "FORK" else .state end')
        if [ "$PR_STATE" != "OPEN" ]; then
          echo "::error::PR #$PR_NUMBER is $PR_STATE; only an open PR from a branch in this repo is staged." >&2
          exit 1
        fi

  test:
    name: Test
    # Under `pull_request`, Authorize is skipped. Otherwise the PR's code runs
    # only after Authorize passes: a skipped Authorize (any comment that is not
    # a staging command) skips this job too.
    needs: authorize
    if: ${{ !cancelled() && inputs.run-tests && (github.event_name == 'pull_request' || needs.authorize.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        # Empty under `pull_request` (the default merge ref); otherwise the
        # requested PR's head.
        ref: ${{ github.event_name != 'pull_request' && inputs.pr-number != '' && format('refs/pull/{0}/head', inputs.pr-number) || '' }}

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.0'
        bundler-cache: true

    - name: Install Homebrew dependencies
      run: |
        # Homebrew refuses to load formulae and casks from an untrusted tap, and
        # `brew bundle` does not trust the Brewfile's taps for us.
        brew trust armcknight/tools
        brew bundle

    - name: Generate Xcode project
      env:
        # The caller names the arkana keys it needs (inputs.arkana-keys); their
        # values come from the caller's own secrets via `secrets: inherit`. This
        # keeps the workflow app-agnostic — it knows no specific key names. arkana
        # hard-fails if a key declared in the app's .arkana.yml is absent, so a
        # missing secret fails the build loudly (no silent stubs).
        ALL_SECRETS: ${{ toJSON(secrets) }}
        ARKANA_KEYS: ${{ inputs.arkana-keys }}
      run: |
        # Materialize gitignored config files (e.g. .envrc) from committed
        # templates so xcodegen fileGroups validate.
        for ex in .env.example .envrc.example; do real="${ex%.example}"; { [ -f "$ex" ] && [ ! -f "$real" ] && cp "$ex" "$real"; } || true; done
        # Resolve each requested key from the inherited secrets (case-insensitive,
        # so GH secret SENTRYDSN satisfies arkana key SentryDSN) and write to .env.
        : > .env
        for key in $ARKANA_KEYS; do
          val=$(printf '%s' "$ALL_SECRETS" | jq -r --arg k "$key" '[to_entries[] | select(.key | ascii_downcase == ($k | ascii_downcase))][0].value // empty')
          [ -n "$val" ] && printf '%s=%s\n' "$key" "$val" >> .env
        done
        bundle exec arkana
        xcodegen

    - name: Run tests
      run: bundle exec fastlane ios test
      env:
        CI: true

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: "fastlane/test_output/junit.xml"
        check_name: "Test Results"
        fail_on_failure: true
        detailed_summary: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: fastlane/test_output
        retention-days: 7

  stage:
    name: Stage
    # Only on demand (never under `pull_request`), after Authorize passes, and
    # after the tests pass — or when they were skipped (run-tests: false) — but
    # never when they failed.
    needs: [authorize, test]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && needs.test.result != 'failure' }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Lifetime of both the assumed-role session and the presigned install link.
      LINK_TTL_SECONDS: "43200"

    steps:
    # Outside `pull_request` there is no head_ref, so look up the requested PR's
    # head branch.
    - name: Resolve PR head branch
      id: pr
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        echo "head-ref=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        # Check out the PR's head branch by name rather than the default detached
        # merge commit, so inject-git-info records the real branch and commit in
        # the staged IPA (otherwise GIT_BRANCH=HEAD and GIT_COMMIT_HASH is the
        # ephemeral merge SHA).
        ref: ${{ steps.pr.outputs.head-ref }}

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.0'
        bundler-cache: true

    - name: Install Homebrew dependencies
      run: |
        # Homebrew refuses to load formulae and casks from an untrusted tap, and
        # `brew bundle` does not trust the Brewfile's taps for us.
        brew trust armcknight/tools
        brew bundle

    - name: Generate Xcode project
      env:
        # The caller names the arkana keys it needs (inputs.arkana-keys); their
        # values come from the caller's own secrets via `secrets: inherit`. This
        # keeps the workflow app-agnostic — it knows no specific key names. arkana
        # hard-fails if a key declared in the app's .arkana.yml is absent, so a
        # missing secret fails the build loudly (no silent stubs).
        ALL_SECRETS: ${{ toJSON(secrets) }}
        ARKANA_KEYS: ${{ inputs.arkana-keys }}
      run: |
        # Materialize gitignored config files (e.g. .envrc) from committed
        # templates so xcodegen fileGroups validate.
        for ex in .env.example .envrc.example; do real="${ex%.example}"; { [ -f "$ex" ] && [ ! -f "$real" ] && cp "$ex" "$real"; } || true; done
        # Resolve each requested key from the inherited secrets (case-insensitive,
        # so GH secret SENTRYDSN satisfies arkana key SentryDSN) and write to .env.
        : > .env
        for key in $ARKANA_KEYS; do
          val=$(printf '%s' "$ALL_SECRETS" | jq -r --arg k "$key" '[to_entries[] | select(.key | ascii_downcase == ($k | ascii_downcase))][0].value // empty')
          [ -n "$val" ] && printf '%s=%s\n' "$key" "$val" >> .env
        done
        bundle exec arkana
        xcodegen

    - name: Install match SSH key
      run: |
        mkdir -p ~/.ssh
        echo "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan github.com >> ~/.ssh/known_hosts
      env:
        MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}

    - name: Build ad-hoc IPA
      run: bundle exec fastlane ios stage
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        role-duration-seconds: ${{ env.LINK_TTL_SECONDS }}

    # Shared with ota-refresh.yml. Pinned to main: a reusable workflow cannot
    # refer to an action at its own ref.
    - name: Set up stale-comments
      uses: armcknight/workflows/.github/actions/stale-comments@main

    - name: Set up build-expiry
      uses: armcknight/workflows/.github/actions/build-expiry@main

    - name: Publish OTA build to S3 and comment on PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        S3_BUCKET: ${{ vars.S3_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        PROJECT: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ inputs.pr-number }}
        RUN_ID: ${{ github.run_id }}
        IPA_NAME: ${{ inputs.ipa-name }}
      run: |
        SHA=$(git rev-parse HEAD)
        RESULT=$(ota-publish \
          --mode initial \
          --ipa "${IPA_NAME}.ipa" \
          --bucket "$S3_BUCKET" \
          --region "$AWS_REGION" \
          --project "$PROJECT" \
          --pr "$PR_NUMBER" \
          --run-id "$RUN_ID" \
          --ttl "$LINK_TTL_SECONDS")
        LANDING=$(echo "$RESULT" | jq -r '.landingUrl')
        EXPIRES=$(echo "$RESULT" | jq -r '.expiresAt')
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

        printf 'Staging build ready (commit `%s`, [run %s](%s)).\n\nOpen on your iPhone/iPad in **Safari** on a registered device, then tap Install:\n\n[📲 Install staging build](%s)\n\n_Link expires %s. Comment `/refresh-staging` on this PR for a fresh link — no rebuild needed. Comment `/build-staging` for a new build of the newest commit._\n' \
          "${SHA::7}" "$RUN_ID" "$RUN_URL" "$LANDING" "$EXPIRES" > /tmp/pr-comment.md
        BUILD_EXPIRES=$(build-expiry "$S3_BUCKET" "$PROJECT" "$PR_NUMBER" "$RUN_ID")
        if [ -n "$BUILD_EXPIRES" ]; then
          printf '\n_The build itself is deleted %s, by the lifecycle rule on the staging bucket._\n' \
            "$BUILD_EXPIRES" >> /tmp/pr-comment.md
        fi

        # A new build makes the PR's earlier install links, refresh notices and
        # `/refresh-staging` and `/build-staging` commands stale (not its UI
        # screenshots, which the ui-screenshots job replaces itself). Read them
        # before posting, so the new comment is never among them.
        stale-comments collect "$PR_NUMBER" /tmp/stale-comments.jsonl
        gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
        stale-comments hide /tmp/stale-comments.jsonl staged refreshed notice command

  ui-screenshots:
    name: UI screenshots
    # Runs beside the other jobs: it only reports, so nothing waits on it.
    if: inputs.ui-screenshots-scheme != '' && github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        # The default merge commit and its first parent, the base branch, so
        # `HEAD^1..HEAD` is exactly the PR's change.
        fetch-depth: 2

    # Pinned to main: a reusable workflow cannot refer to an action at its own
    # ref.
    - name: Set up ui-screenshots
      uses: armcknight/workflows/.github/actions/ui-screenshots@main

    - name: Set up stale-comments
      uses: armcknight/workflows/.github/actions/stale-comments@main

    - name: Find the UI tests this PR adds or changes
      id: tests
      env:
        TEST_DIR: ${{ inputs.ui-screenshots-path }}
        TEST_TARGET: ${{ inputs.ui-screenshots-target || inputs.ui-screenshots-scheme }}
        # Read for its `<!-- ui-screenshots: … -->` marker. An env var, never
        # inlined into the script: anyone who can edit the PR writes it.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if [ -z "$TEST_DIR" ]; then
          echo "::error::Set ui-screenshots-path along with ui-screenshots-scheme."
          exit 1
        fi
        ONLY_TESTING=$(ui-screenshots tests "$TEST_DIR" "$TEST_TARGET")
        echo "only-testing=$ONLY_TESTING" >> "$GITHUB_OUTPUT"
        if [ -z "$ONLY_TESTING" ]; then
          echo "This PR adds or changes no UI tests under $TEST_DIR and names none in a ui-screenshots marker; nothing to screenshot."
        else
          echo "Running: $ONLY_TESTING"
        fi

    - name: Setup Ruby
      if: steps.tests.outputs.only-testing != ''
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.0'
        bundler-cache: true

    - name: Install Homebrew dependencies
      if: steps.tests.outputs.only-testing != ''
      run: |
        # Homebrew refuses to load formulae and casks from an untrusted tap, and
        # `brew bundle` does not trust the Brewfile's taps for us.
        brew trust armcknight/tools
        brew bundle

    - name: Generate Xcode project
      if: steps.tests.outputs.only-testing != ''
      env:
        # The caller names the arkana keys it needs (inputs.arkana-keys); their
        # values come from the caller's own secrets via `secrets: inherit`. This
        # keeps the workflow app-agnostic — it knows no specific key names. arkana
        # hard-fails if a key declared in the app's .arkana.yml is absent, so a
        # missing secret fails the build loudly (no silent stubs).
        ALL_SECRETS: ${{ toJSON(secrets) }}
        ARKANA_KEYS: ${{ inputs.arkana-keys }}
      run: |
        # Materialize gitignored config files (e.g. .envrc) from committed
        # templates so xcodegen fileGroups validate.
        for ex in .env.example .envrc.example; do real="${ex%.example}"; { [ -f "$ex" ] && [ ! -f "$real" ] && cp "$ex" "$real"; } || true; done
        # Resolve each requested key from the inherited secrets (case-insensitive,
        # so GH secret SENTRYDSN satisfies arkana key SentryDSN) and write to .env.
        : > .env
        for key in $ARKANA_KEYS; do
          val=$(printf '%s' "$ALL_SECRETS" | jq -r --arg k "$key" '[to_entries[] | select(.key | ascii_downcase == ($k | ascii_downcase))][0].value // empty')
          [ -n "$val" ] && printf '%s=%s\n' "$key" "$val" >> .env
        done
        bundle exec arkana
        xcodegen

    - name: Run the UI tests
      id: run
      if: steps.tests.outputs.only-testing != ''
      env:
        SCHEME: ${{ inputs.ui-screenshots-scheme }}
        DESTINATION: ${{ inputs.ui-screenshots-destination }}
        ONLY_TESTING: ${{ steps.tests.outputs.only-testing }}
      run: |
        DESTINATION="${DESTINATION:-$(ui-screenshots destination)}"
        # Keep going when a test fails: its screenshots, and the one XCTest
        # takes at the failure, are what explain it. The publish step fails the
        # job afterwards.
        set +e
        # shellcheck disable=SC2086 # ONLY_TESTING is one argument per test class.
        xcodebuild test \
          -scheme "$SCHEME" \
          -destination "$DESTINATION" \
          -resultBundlePath ui-screenshots.xcresult \
          $ONLY_TESTING \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify
        STATUS=${PIPESTATUS[0]}
        set -e
        if [ "$STATUS" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment the screenshots on the PR
      if: ${{ !cancelled() && steps.run.outcome != 'skipped' && steps.tests.outputs.only-testing != '' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha }}
        PASSED: ${{ steps.run.outputs.passed }}
      run: |
        if [ -d ui-screenshots.xcresult ]; then
          ui-screenshots publish ui-screenshots.xcresult "$PR_NUMBER" "$SHA" "${PASSED:-false}" /tmp/ui-screenshots.md
        else
          echo "The UI tests made no result bundle."
        fi
        if [ -s /tmp/ui-screenshots.md ]; then
          # Only the newest set of screenshots stays visible.
          stale-comments collect "$PR_NUMBER" /tmp/stale-comments.jsonl
          gh pr comment "$PR_NUMBER" --body-file /tmp/ui-screenshots.md
          stale-comments hide /tmp/stale-comments.jsonl media
        fi
        if [ "$PASSED" != "true" ]; then
          echo "::error::The UI tests failed."
          exit 1
        fi
