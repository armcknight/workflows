name: release

# This repo's own release. Like ci.yml it has no `workflow_call` trigger.
#
# `make deploy` migrates the changelog, tags and pushes from a workstation. This
# picks the tag up and releases it with this repo's own shared workflow, the
# same one callers use: it publishes the GitHub release from the changelog
# section and moves the major alias tag that callers pin.

on:
  push:
    tags:
    # prepare-release names the tag after the version file exactly — bare, with
    # no `v` prefix. A release candidate carries a `-RC<n>` suffix.
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    # The workflow at the tagged commit, so a release runs the release's own
    # github-release.yml and scripts.
    uses: ./.github/workflows/github-release.yml
    with:
      major-alias: true
