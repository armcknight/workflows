name: Fly deploy (reusable)

# Deploys a Fly app from the tip of the default branch, with its commit as the
# GIT_SHA build argument, then waits until the health check answers with that
# commit.
#
# A deploy is the owner's action, and agents never start one. `deploy-on`
# says which events deploy:
#
# * `manual` (the default): only `workflow_dispatch`, a run the owner starts.
# * `merge`: also each push to the default branch, which is a merge, and only
#   the owner merges.
#
# The caller triggers on both, so that changing `deploy-on` is the only edit:
#
#   on:
#     workflow_dispatch:
#     push:
#       branches: [main]
#
#   jobs:
#     deploy:
#       uses: armcknight/workflows/.github/workflows/fly-deploy.yml@4
#       with:
#         app: my-server
#         health-check-path: /healthz
#         deploy-on: manual
#       secrets:
#         FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
#
# FLY_API_TOKEN is a deploy token for the one app: `fly tokens create deploy`.
#
# Like `make server deploy`, it refuses to deploy a commit that is not the tip
# of the default branch, such as a run started from another branch, or a rerun
# of an old push: `fly deploy` would put code on the server that is not on the
# default branch.

on:
  workflow_call:
    inputs:
      app:
        description: "The Fly app."
        required: true
        type: string
      deploy-on:
        description: "`manual`: deploy only on `workflow_dispatch`. `merge`: also on each push to the default branch."
        required: false
        type: string
        default: "manual"
      health-check-path:
        description: "The path that answers 200, with the deployed commit in its body, when the server is ready."
        required: false
        type: string
        default: "/healthz"
      url:
        description: "The server's URL, for the health check. Empty (the default) is `https://<app>.fly.dev`."
        required: false
        type: string
        default: ""
      require-sha:
        description: "Wait until the health check's body has the deployed commit, not only a 200. Set `false` for a server whose health check does not return GIT_SHA yet."
        required: false
        type: boolean
        default: true
      health-timeout-seconds:
        description: "How long to wait for the health check after the deploy."
        required: false
        type: number
        default: 180
      config:
        description: "The Fly configuration file, relative to the repository root."
        required: false
        type: string
        default: "fly.toml"
    secrets:
      FLY_API_TOKEN:
        description: "A deploy token for the app."
        required: true

permissions:
  contents: read

jobs:
  check-inputs:
    name: Check the inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy-on
        env:
          DEPLOY_ON: ${{ inputs.deploy-on }}
        run: |
          case "$DEPLOY_ON" in
            manual|merge) ;;
            *) echo "::error::deploy-on is '$DEPLOY_ON'; it must be manual or merge."; exit 1 ;;
          esac

  deploy:
    name: Deploy ${{ inputs.app }}
    needs: check-inputs
    if: >
      github.event_name == 'workflow_dispatch' ||
      (inputs.deploy-on == 'merge' &&
       github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # One deploy of an app at a time. A deploy that has started is never
    # cancelled: the next one waits.
    concurrency:
      group: fly-deploy-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Refuse a commit that is not the tip of the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          head=$(git rev-parse HEAD)
          tip=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$tip" ]; then
            echo "::error::This run is at $head, but $DEFAULT_BRANCH is at $tip. Deploy only the tip of $DEFAULT_BRANCH: start the workflow from $DEFAULT_BRANCH again."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The checkout has changes."
            git status --short
            exit 1
          fi
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          CONFIG: ${{ inputs.config }}
        run: flyctl deploy --remote-only --app "$APP" --config "$CONFIG" --build-arg GIT_SHA="$SHA"

      - name: Wait for the health check
        env:
          APP: ${{ inputs.app }}
          URL: ${{ inputs.url }}
          HEALTH_PATH: ${{ inputs.health-check-path }}
          REQUIRE_SHA: ${{ inputs.require-sha }}
          TIMEOUT: ${{ inputs.health-timeout-seconds }}
        run: |
          set -uo pipefail
          check="${URL:-https://$APP.fly.dev}$HEALTH_PATH"
          deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if body=$(curl -fsS --max-time 10 "$check" 2>/dev/null); then
              if [ "$REQUIRE_SHA" != "true" ] || printf '%s' "$body" | grep -q "$SHA"; then
                echo "Deployed $SHA to $APP, and $check answers."
                echo "Deployed \`$SHA\` to \`$APP\`; [$check]($check) answers." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done
          if [ "$REQUIRE_SHA" = "true" ]; then
            echo "::error::The deploy finished, but $check did not answer with $SHA in ${TIMEOUT}s. See flyctl logs --app $APP."
          else
            echo "::error::The deploy finished, but $check did not answer in ${TIMEOUT}s. See flyctl logs --app $APP."
          fi
          exit 1
