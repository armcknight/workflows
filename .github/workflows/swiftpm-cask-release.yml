name: SwiftPM cask release (reusable)

# Reusable release pipeline for armcknight SwiftPM command-line tools distributed
# through the armcknight/homebrew-tools Homebrew tap.
#
# On a version tag in the caller repo, this workflow:
#   1. checks the tag against the version compiled into the source,
#   2. builds the release binaries with `swift build -c release`,
#   3. optionally Developer ID signs and notarizes them (`sign: true`),
#   4. tars them and attaches the tarball to a release on the *tap* repo — so the
#      cask URL is downloadable with no credentials, whether or not the source
#      repo is public,
#   5. bumps `version` + `sha256` in `Casks/<cask-name>.rb` in the tap, rewrites
#      its `binary` lines from the `binaries` input, and pushes.
#
# A final tag (1.2.3) routes to `Casks/<cask-name>.rb`; a release candidate
# (1.2.3-RC1, as `prepare-release rc` names it) routes to `Casks/<cask-name>-rc.rb`, so an RC never disturbs the
# stable channel.
#
# Caller requirements:
#   - secrets (via `secrets: inherit`): TAP_RELEASE_TOKEN — a fine-grained PAT
#     with `Contents: read+write` on the tap repo. It creates the release there
#     and pushes the cask bump.
#   - with `sign: true`, also the `match-git-url`, `team-id` + `bundle-id`
#     inputs and the secrets MATCH_PASSWORD, MATCH_DEPLOY_KEY, NOTARY_KEY,
#     NOTARY_KEY_ID, NOTARY_ISSUER_ID. The Developer ID Application certificate
#     is read from the fastlane match repo (readonly, same as
#     macos-cask-release.yml). The workflow names a missing one rather than
#     shipping an unsigned build.
#   - `Casks/<cask-name>.rb` already committed to the tap, with at least one
#     `binary` line. This workflow rewrites the version, sha256 and binary lines;
#     it never creates the file.
#
# Signing is optional here, unlike macos-cask-release.yml where it is mandatory.
# Homebrew quarantines every cask download, but a `binary` artifact run from a
# shell is not subject to the same Gatekeeper launch check a .app is, so an
# unsigned CLI still works. Turn `sign` on for a tool that is executed by
# something other than the user's shell.

on:
  workflow_call:
    inputs:
      cask-name:
        description: "Cask file base name in the tap (Casks/<cask-name>.rb). Also the prefix of the tap release and its asset."
        required: true
        type: string
      binaries:
        description: "Executables to take from .build/release, separated by spaces or newlines."
        required: true
        type: string
      version-file:
        description: "File holding the version compiled into the tool, checked against the tag. Empty to skip that check."
        required: false
        type: string
        default: ""
      version-regex:
        description: "sed -E expression with one capture group that pulls the version out of version-file, e.g. `.*static let version = \"([^\"]+)\".*`. Required when version-file is set."
        required: false
        type: string
        default: ""
      tap-repo:
        description: "Tap that hosts the cask and the release asset."
        required: false
        type: string
        default: "armcknight/homebrew-tools"
      sign:
        description: "Developer ID sign and notarize the binaries before packaging."
        required: false
        type: boolean
        default: false
      match-git-url:
        description: "SSH URL of the fastlane match repo holding the Developer ID Application certificate. Required when sign is true."
        required: false
        type: string
        default: ""
      team-id:
        description: "Apple Developer team ID that owns the signing certificate. Required when sign is true."
        required: false
        type: string
        default: ""
      bundle-id:
        description: "Bundle identifier passed to fastlane match as app_identifier. match requires it even for a developer_id fetch with skip_provisioning_profiles, though it is unused for the team-wide certificate. Required when sign is true."
        required: false
        type: string
        default: ""
      runs-on:
        description: "Runner label. Must be macOS: this workflow signs, notarizes, and uses BSD sed."
        required: false
        type: string
        default: "macos-15"
      submodules:
        description: "Passed to actions/checkout. Use `recursive` when the package's dependencies are vendored as git submodules (e.g. path-based SwiftPM deps). Empty (the default) checks out no submodules."
        required: false
        type: string
        default: ""
    secrets:
      TAP_RELEASE_TOKEN:
        description: "Fine-grained PAT with Contents: read+write on the tap repo."
        required: true
      # GitHub cannot make a secret conditionally required, so these are declared
      # optional and checked at run time when `sign` is on.
      MATCH_PASSWORD:
        description: "Passphrase the fastlane match repo is encrypted with. Required when sign is true."
        required: false
      MATCH_DEPLOY_KEY:
        description: "SSH private key with read access to the match repo. Required when sign is true."
        required: false
      NOTARY_KEY:
        description: "base64 of an App Store Connect API key .p8. Required when sign is true."
        required: false
      NOTARY_KEY_ID:
        description: "Key ID of that API key. Required when sign is true."
        required: false
      NOTARY_ISSUER_ID:
        description: "Issuer ID of that API key. Required when sign is true."
        required: false

jobs:
  release:
    name: Release
    runs-on: ${{ inputs.runs-on }}
    steps:
    # The scripts in this repository, at the commit of this workflow. They go
    # out of the workspace, so that they are not in the caller's checkout.
    - name: Check out the scripts
      uses: actions/checkout@v5
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .armcknight-workflows
        sparse-checkout: scripts
    - name: Move the scripts out of the workspace
      run: |
        mv .armcknight-workflows "$RUNNER_TEMP/armcknight-workflows"
        echo "SCRIPTS=$RUNNER_TEMP/armcknight-workflows/scripts" >> "$GITHUB_ENV"

    - uses: actions/checkout@v5
      with:
        submodules: ${{ inputs.submodules }}

    - name: Resolve version and cask path
      id: ver
      env:
        CASK_NAME: ${{ inputs.cask-name }}
        VERSION_FILE: ${{ inputs.version-file }}
        VERSION_REGEX: ${{ inputs.version-regex }}
      run: |
        set -euo pipefail

        TAG="$GITHUB_REF_NAME"

        # The tag names the release, but the version compiled into the binary is
        # what a user sees from `--version`. If they disagree, every bug report
        # cites the wrong build.
        if [ -n "$VERSION_FILE" ]; then
          SRC_VERSION=$("$SCRIPTS/release/source-version.sh")
          TAG="$TAG" VERSION="$SRC_VERSION" VERSION_SOURCE="$VERSION_FILE" \
            "$SCRIPTS/release/check-tag-version.sh"
        else
          echo "::notice::No version-file given, so the tag is not checked against the source."
        fi

        echo "version=$TAG" >> "$GITHUB_OUTPUT"
        CASK_PATH=$(TAG="$TAG" "$SCRIPTS/release/cask-path.sh")
        echo "cask_path=$CASK_PATH" >> "$GITHUB_OUTPUT"

    - name: Build release binaries
      run: swift build -c release

    - name: Check every named binary was built
      env:
        BINARIES: ${{ inputs.binaries }}
        BIN_DIR: .build/release
      run: |
        "$SCRIPTS/release/check-binaries.sh"

    - name: Sign and notarize
      id: signing
      if: inputs.sign
      env:
        BINARIES: ${{ inputs.binaries }}
        MATCH_GIT_URL: ${{ inputs.match-git-url }}
        TEAM_ID: ${{ inputs.team-id }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        KEYCHAIN: swiftpm-cask-release
        FASTLANE_SKIP_UPDATE_CHECK: "1"
        LC_ALL: en_US.UTF-8
        LANG: en_US.UTF-8
      run: |
        set -euo pipefail

        for name in MATCH_GIT_URL TEAM_ID BUNDLE_ID MATCH_PASSWORD MATCH_DEPLOY_KEY NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
          if [ -z "${!name:-}" ]; then
            echo "::error::sign is true, so $name is required (the match-git-url/team-id input, or the secret behind it)."
            exit 1
          fi
        done

        "$SCRIPTS/signing/install-match-key.sh"

        # Before match runs, so the cleanup step deletes the keychain even when
        # match fails.
        echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
        # The Developer ID Application cert is team-wide, so match's
        # app_identifier is unused; the caller supplies it via bundle-id. Uses
        # the runner's preinstalled fastlane, so the caller needs no Gemfile.
        IDENTITY=$(APP_IDENTIFIER="$BUNDLE_ID" "$SCRIPTS/signing/match-signing-identity.sh")

        export ZIP="${RUNNER_TEMP}/notarize.zip"
        IDENTITY="$IDENTITY" BIN_DIR=.build/release "$SCRIPTS/signing/sign-binaries.sh"
        "$SCRIPTS/signing/notarize.sh"

        # No `stapler` step: it only writes a ticket into a bundle, a .dmg or a
        # .pkg, and these are bare executables. Gatekeeper looks the ticket up
        # online instead, which is why the notarization above still matters.

    - name: Package tarball
      id: pkg
      env:
        BINARIES: ${{ inputs.binaries }}
        CASK_NAME: ${{ inputs.cask-name }}
      run: |
        set -euo pipefail
        ARCHIVE="${CASK_NAME}-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
        mkdir -p dist
        # shellcheck disable=SC2086
        tar -czf "dist/$ARCHIVE" -C .build/release $BINARIES
        SHA="$(shasum -a 256 "dist/$ARCHIVE" | awk '{print $1}')"
        echo "archive=dist/$ARCHIVE" >> "$GITHUB_OUTPUT"
        echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

    # The asset goes to the tap, not to this repo: `brew` fetches a cask URL with
    # no credentials, so a private source repo's release asset would 404 for it.
    - name: Create release on tap repo
      env:
        GH_TOKEN: ${{ secrets.TAP_RELEASE_TOKEN }}
        TAP_REPO: ${{ inputs.tap-repo }}
        CASK_NAME: ${{ inputs.cask-name }}
        ARCHIVE: ${{ steps.pkg.outputs.archive }}
      run: |
        set -euo pipefail
        gh release create "${CASK_NAME}-${GITHUB_REF_NAME}" \
          --repo "$TAP_REPO" \
          --title "${CASK_NAME} ${GITHUB_REF_NAME}" \
          --notes "Binary release for ${CASK_NAME} ${GITHUB_REF_NAME} (aarch64-apple-darwin)." \
          "$ARCHIVE"

    - name: Bump cask in tap repo
      env:
        GH_TOKEN: ${{ secrets.TAP_RELEASE_TOKEN }}
        TAP_REPO: ${{ inputs.tap-repo }}
        CASK_NAME: ${{ inputs.cask-name }}
        VERSION: ${{ steps.ver.outputs.version }}
        SHA256: ${{ steps.pkg.outputs.sha256 }}
        CASK_PATH: ${{ steps.ver.outputs.cask_path }}
        BINARIES: ${{ inputs.binaries }}
      run: |
        set -euo pipefail
        # The archive holds exactly `binaries`, so bump-cask.sh rewrites the
        # cask's binary lines from BINARIES.
        COMMIT_MESSAGE="${CASK_NAME}: bump $(basename "$CASK_PATH" .rb) to ${VERSION}" \
          "$SCRIPTS/release/bump-cask.sh"

    - name: Clean up signing keychain
      if: always() && steps.signing.outputs.keychain != ''
      env:
        KEYCHAIN: ${{ steps.signing.outputs.keychain }}
      run: security delete-keychain "$KEYCHAIN" || true
