name: GitHub release (reusable)

# Reusable release pipeline for repos with nothing to build, sign or upload —
# where tagging *is* the release. A SwiftPM library (armcknight/swift-armcknight)
# is resolved by dependents straight from the git tag; a Hammerspoon Spoon
# repo (armcknight/hammerspoons) is installed off the branch. In both cases the
# release is the published record of a tag, with notes taken from the changelog.
#
# On a version tag in the caller repo, this workflow creates a GitHub release
# from that version's changelog section, and optionally attaches files to it.
#
# `make deploy` in the caller migrates the changelog, tags and pushes from a
# workstation. Publishing the release happens here so it never depends on which
# machine tagged.
#
# A tag carrying a prerelease suffix (anything after a `-`, which is how
# prepare-release names an RC) is published as a prerelease, so the newest final
# release stays the one GitHub shows as "Latest". Set `prerelease: true` to force
# it for a tag that carries no suffix.
#
# Set `major-alias: true` to also move the major alias tag that callers pin —
# `2` for the tag 2.1.0, `v1` for the tag v1.2.3 — to a final release. It never
# moves for a release candidate, refuses a tag the default branch does not
# contain, and stays put when a newer final release of the same major exists,
# so a patch cut on an older line never drags it backwards.
#
# Caller requirements:
#   - trigger on a version tag push (`X.Y.Z`, optionally with an RC suffix)
#   - `permissions: contents: write` (to create the release)
#   - a CHANGELOG.md with a section for the version being released
#   - optional: the SITE_DISPATCH_TOKEN secret, passed by name or with
#     `secrets: inherit`, to ask armcknight/mcknight.io to refresh its projects
#     page once the release is published (see README)
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: armcknight/workflows/.github/workflows/github-release.yml@2
#
# To gate the release on a check, put it in its own job and depend on it — this
# workflow runs no caller-supplied commands:
#
#   jobs:
#     verify:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v5
#         - run: make verify
#     release:
#       needs: verify
#       permissions:
#         contents: write
#       uses: armcknight/workflows/.github/workflows/github-release.yml@2
#       with:
#         assets: Spoons/*.spoon.zip

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label."
        required: false
        type: string
        default: "macos-15"
      changelog:
        description: "Path to the changelog used for release notes."
        required: false
        type: string
        default: "CHANGELOG.md"
      assets:
        description: "Files to attach to the release, as a whitespace-separated list of paths or globs. Empty (the default) attaches nothing."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Force the release to be marked a prerelease. A tag with a prerelease suffix is marked one regardless."
        required: false
        type: boolean
        default: false
      major-alias:
        description: "Move the major alias tag (`2` for 2.1.0) to the tag after a final release. Never for a release candidate, and only when the tag is on the default branch and is the newest of its major."
        required: false
        type: boolean
        default: false

    secrets:
      SITE_DISPATCH_TOKEN:
        description: "Token with Contents: read+write on armcknight/mcknight.io. When set, a published release asks it to refresh its projects page. Empty (the default) skips that."
        required: false

jobs:
  github-release:
    name: Publish GitHub release
    # prepare-github-release ships in the tools cask, and a cask is macOS only.
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          # prepare-github-release reads the changelog section for the tag, and
          # needs the tag's history to resolve it.
          fetch-depth: 0

      # scripts/ at the commit of this workflow, out of the workspace, in $SCRIPTS.
      - name: Check out the scripts
        uses: armcknight/workflows/.github/actions/scripts@main
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Install armcknight/tools
        run: |
          set -euo pipefail
          # Homebrew refuses to load formulae and casks from an untrusted tap.
          brew trust armcknight/tools
          brew install --cask armcknight/tools/tools

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          "$SCRIPTS/release/publish-github-release.sh"

      # Skipped entirely when `assets` is empty, so a caller with nothing to
      # attach needs no extra configuration.
      - name: Attach the assets
        if: ${{ inputs.assets != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ inputs.assets }}
        run: |
          set -euo pipefail
          # Deliberately unquoted: ASSETS is a whitespace-separated list of paths
          # and globs that must word-split and expand here.
          # shellcheck disable=SC2086
          gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber

      # After the release is published, so that only a published release notifies
      # mcknight.io. Without the SITE_DISPATCH_TOKEN secret it does nothing.
      - name: Notify mcknight.io
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          "$SCRIPTS/site/notify.sh"

  major-alias:
    name: Move the major alias tag
    # A release candidate must never reach a caller pinned to a bare major. The
    # script checks this too; skipping the job here saves a runner.
    if: ${{ inputs.major-alias && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # scripts/ at the commit of this workflow, out of the workspace, in $SCRIPTS.
      - name: Check out the scripts
        uses: armcknight/workflows/.github/actions/scripts@main
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Move the alias
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          "$SCRIPTS/release/move-major-alias.sh"
