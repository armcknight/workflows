name: OTA refresh (reusable)

# Re-sign a PR's staging OTA install link without rebuilding. The caller wires
# the trigger (issue_comment and/or workflow_dispatch) and passes the PR number.
# The command text is checked here, not in the caller: under `issue_comment`,
# the job is skipped, with no runner, unless the comment is `/refresh-staging`
# on a PR.
#
# The staging bucket deletes builds after `retention-days`. When the PR's build
# is gone for that reason and the caller sets `rebuild-expired`, this workflow
# sets the `rebuild` output instead of failing, and the caller runs ios-ci.yml
# for the PR in a job that needs this one (see README). In every other
# missing-build case it comments the reason on the PR and fails.
#
# Caller requirements: repo vars AWS_ROLE_ARN/AWS_REGION/S3_BUCKET;
# permissions: pull-requests: write, id-token: write.
#
# A refresh mints a presigned install link, so the job checks the commenter's
# author_association before it does anything else.

on:
  workflow_call:
    inputs:
      pr-number:
        description: "PR number whose staging link to refresh"
        required: true
        type: string
      run-id:
        description: "Specific stage run id (optional; defaults to the PR's latest build)"
        required: false
        type: string
      comment-id:
        description: "Comment id to react to (optional; from the /refresh-staging comment)"
        required: false
        type: string
      rebuild-expired:
        description: "When the PR's build was deleted by the bucket's lifecycle rule, set the `rebuild` output instead of failing. Only set this when the caller has a job that runs ios-ci.yml on that output."
        required: false
        type: boolean
        default: false
      retention-days:
        description: "Days after which the bucket's lifecycle rule deletes a staging build"
        required: false
        type: number
        default: 30
    outputs:
      rebuild:
        description: "'true' when the build expired and the caller should run ios-ci.yml for the PR"
        value: ${{ jobs.refresh.outputs.rebuild }}

jobs:
  refresh:
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/refresh-staging'))
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      pull-requests: write
      id-token: write
    outputs:
      rebuild: ${{ steps.refresh.outputs.rebuild }}
    env:
      LINK_TTL_SECONDS: "43200"

    steps:
    # scripts/ at the commit of this workflow, out of the workspace, in $SCRIPTS.
    - name: Check out the scripts
      uses: armcknight/workflows/.github/actions/scripts@main
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}

    # This job assumes the AWS role and mints a presigned link to the build, so
    # a commenter who cannot write to the repo must not get an install link.
    - name: Check that the commenter can write to the repo
      if: github.event_name == 'issue_comment'
      env:
        ASSOCIATION: ${{ github.event.comment.author_association }}
        ACTION: refresh
      run: |
        "$SCRIPTS/staging/check-commenter.sh"

    - name: Acknowledge command
      if: inputs.comment-id != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
          -f content=eyes --silent || true

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
        role-duration-seconds: ${{ env.LINK_TTL_SECONDS }}

    - name: Install ota-publish
      run: brew install armcknight/tools/tools

    # Shared with ios-ci.yml. Pinned to main: a reusable workflow cannot refer
    # to an action at its own ref.
    - name: Set up stale-comments
      uses: armcknight/workflows/.github/actions/stale-comments@main

    - name: Set up build-expiry
      uses: armcknight/workflows/.github/actions/build-expiry@main

    - name: Re-sign OTA link and comment on PR
      id: refresh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This job has no checkout, so point gh at the repo explicitly;
        # otherwise `gh pr comment` shells out to git and fails with
        # "not a git repository".
        GH_REPO: ${{ github.repository }}
        S3_BUCKET: ${{ vars.S3_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        PR_NUMBER: ${{ inputs.pr-number }}
        RUN_ID: ${{ inputs.run-id }}
        REBUILD_EXPIRED: ${{ inputs.rebuild-expired }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        PROJECT: ${{ github.event.repository.name }}
      run: |
        # refresh.sh exits 10 when the build expired and the caller should
        # rebuild it.
        STATUS=0
        "$SCRIPTS/staging/refresh.sh" || STATUS=$?
        if [ "$STATUS" -eq 10 ]; then
          echo "rebuild=true" >> "$GITHUB_OUTPUT"
          STATUS=0
        fi
        exit "$STATUS"
